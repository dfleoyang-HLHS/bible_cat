name: 自動抓取並更新每週禱告日誌

on:
  schedule:
    # 設定每週一 UTC 時間 00:00 (台灣時間週一早上 8:00) 自動執行
    - cron: '0 0 * * 1'
  workflow_dispatch: # 允許您在 GitHub 網頁上隨時手動點按按鈕觸發執行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: 安裝爬蟲依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4

    - name: 執行爬蟲抓取最新禱告日誌
      run: python fetch_prayers.py

    - name: 自動 Commit 與 Push 回專案
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add prayers.json
        git diff-index --quiet HEAD || git commit -m "🤖 自動更新：每週聚會禱告日誌"
        git push
