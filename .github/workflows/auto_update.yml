name: 自動抓取並更新每週禱告日誌

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v4 # 升級至 v4
      with:
        fetch-depth: 0 # 抓完整歷史，避免 shallow clone 讓後面的 rebase 判斷錯共同祖先

    - name: 設定 Python 環境
      uses: actions/setup-python@v5 # 升級至 v5
      with:
        python-version: '3.10'

    - name: 安裝 Chrome 瀏覽器與依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install selenium webdriver-manager

    - name: 執行 Selenium 模擬點開並抓取最新禱告日誌
      run: python fetch_prayers.py

    - name: 自動 Commit 與 Push 回儲存庫
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add prayers.json
        git diff-index --quiet HEAD || git commit -m "🤖 自動更新：每週聚會禱告日誌"
        # 抓取過程（Selenium）耗時，這段時間內 main 有可能已經被別的 push 更新，
        # 所以推送前先 rebase 到最新的 origin/main，避免 non-fast-forward 被拒絕
        git fetch origin main
        git rebase origin/main
        git push

    - name: 設定 GitHub Pages 部署環境
      uses: actions/configure-pages@v5 # 升級至 v5

    - name: 上傳網站靜態檔案 Artifact
      uses: actions/upload-pages-artifact@v3 # 升級至 v3 (支援核心 v4 artifact)
      with:
        path: '.'

    - name: 部署至 GitHub Pages 網站
      id: deployment
      uses: actions/deploy-pages@v4 # 升級至 v4
