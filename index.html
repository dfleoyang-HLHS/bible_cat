<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聖經分類彙編與小組禱告專區</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-screen overflow-hidden font-sans">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-900 text-white shadow-md z-20 flex-shrink-0">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="flex items-center space-x-3 w-full md:w-auto">
                <button id="mobile-menu-btn" class="md:hidden text-white focus:outline-none p-1">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-book-bible text-amber-400 text-2xl"></i>
                    <h1 class="text-xl font-bold tracking-wide">聖經分類彙編</h1>
                </div>
            </div>

            <!-- 分頁切換 Tab -->
            <div class="flex bg-indigo-950/80 p-1 rounded-xl w-full md:w-auto justify-center space-x-1 text-sm font-semibold">
                <button id="tab-verses-btn" onclick="switchTab('verses')" class="flex-1 md:flex-initial px-4 py-1.5 rounded-lg bg-amber-400 text-indigo-950 shadow transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-book-open"></i><span>經文彙編</span>
                </button>
                <button id="tab-prayer-btn" onclick="switchTab('prayer')" class="flex-1 md:flex-initial px-4 py-1.5 rounded-lg text-indigo-200 hover:text-white hover:bg-indigo-800/50 transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-hands-praying"></i><span>小組聚會禱告專區</span>
                </button>
            </div>

            <div id="search-container" class="relative w-full md:w-72">
                <input type="text" id="search-input" placeholder="搜尋經文、篇名、關鍵字..." 
                       class="w-full bg-indigo-800/60 text-white placeholder-indigo-300 rounded-full pl-9 pr-4 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-indigo-300 text-sm"></i>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <div class="flex flex-1 overflow-hidden relative">

        <!-- ===== 頁面一：經文彙編 ===== -->
        <div id="view-verses" class="flex flex-1 w-full overflow-hidden">
            <aside id="sidebar" class="bg-white border-r border-slate-200 w-72 flex-shrink-0 flex flex-col absolute md:relative inset-y-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out z-10 shadow-lg md:shadow-none">
                <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <span class="font-bold text-slate-700 text-sm tracking-wider uppercase"><i class="fa-solid fa-list-ul mr-2 text-indigo-600"></i>主題分類大綱</span>
                    <button id="close-sidebar-btn" class="md:hidden text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <nav id="category-tree" class="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-1"></nav>
            </aside>
            <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-0 hidden md:hidden"></div>

            <main class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 bg-slate-50">
                <div class="max-w-4xl mx-auto">
                    <div class="mb-6 flex items-center justify-between border-b border-slate-200 pb-3">
                        <div>
                            <h2 id="current-title" class="text-2xl font-bold text-indigo-950">所有經文瀏覽</h2>
                            <p id="current-subtitle" class="text-xs text-slate-500 mt-1">請選擇左側主題分類或搜尋關鍵字</p>
                        </div>
                        <span id="result-count" class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2.5 py-1 rounded-full">0 條經文</span>
                    </div>
                    <div id="cards-container" class="space-y-4"></div>
                </div>
            </main>
        </div>

        <!-- ===== 頁面二：小組聚會禱告專區 ===== -->
        <div id="view-prayer" class="hidden flex-1 w-full flex flex-col md:flex-row overflow-hidden bg-slate-100">
            <aside class="w-full md:w-64 bg-white border-b md:border-b-0 md:border-r border-slate-200 flex-shrink-0 p-4 overflow-y-auto custom-scrollbar">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center">
                    <i class="fa-solid fa-clock-rotate-left mr-2 text-indigo-600"></i>歷期聚會禱告列表
                </h3>
                <div id="prayer-list-container" class="space-y-2"></div>
            </aside>

            <main class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8">
                <div id="prayer-detail-container" class="max-w-3xl mx-auto"></div>
            </main>
        </div>

    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-2.5 rounded-lg shadow-xl text-sm flex items-center space-x-2 transition-opacity duration-300 opacity-0 pointer-events-none z-50">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toast-message">內容已複製！</span>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        let bibleData = null;
        let allVersesFlat = [];

        // 聚會禱告專區資料庫
        const prayerDatabase = [
            {
                id: "prayer-20260913",
                date: "2026.9.13 – 9.19",
                topic: "讓基督的平安在心裡作主",
                scripture: "加拉太書 5:22「聖靈所結的果子，就是仁愛、喜樂、和平……」",
                shareParagraphs: [
                    "聖靈所結的第三個果子是「和平」。這裡的和平是指從神而來的平安，即使人的心在不安、混亂和衝突中，仍然能夠安穩地住在神裡面。真正的平安不是「所有事情都處理好了」才有，而是即使事情尚未解決，我們仍然知道神與我們同在。",
                    "耶穌說：「我留下平安給你們；我將我的平安賜給你們。」（約14:27）耶穌所賜的平安，是祂自己的平安。祂曾經在風浪中仍然安睡，也能在十字架的道路上順服父神。但世界所能給的平安，需要建立在環境穩定、事情順利、人際和諧上。故此，聖靈所結的和平，是幫助我們的心越來越有基督的樣式，不再被外在環境牽著走。",
                    "平安（和平）也會從「我與神的關係」流向「我與人的關係」。真正領受神平安的人，會關注自己是否是使人和好的器皿，不會想要製造紛爭、爭競和對立。當我們面對被誤會或關係緊張時，可以先停下來，把自己的情緒帶到神面前，再問：「主啊，祢要我怎麼回應？」求聖靈掌管我們的口舌，使我們少一點急著證明自己或說明解釋，多一點理解、饒恕與成全。"
                ],
                prayerFocus: "求聖靈使基督的平安在我們裡面作主，自己得享平安，也成為帶來和平的人。",
                prayers: [
                    { title: "1. 為自己禱告", text: "宣告「有基督的平安放在我的心裡，我能不被環境的變化、人的反應和未知的未來和焦慮攪擾。聖靈會提醒我回到平安裡。奉耶穌的名我把重擔交託給祢。請祢來做我思想、情緒和言語的主，牽引我走在祢平安的道路上，有安息的前進。」" },
                    { title: "2. 為教會禱告", text: "奉耶穌的名對教會說：「教會啊，基督和平的群體！服事主的人啊，要分辨平安，不被屬靈謊言蒙蔽而扭曲真理。就算人人個性、觀念、世代、恩賜服事方式不同，我們都以基督的心與平安衡量。問題來臨時候，教會謙卑不逃避，也不彼此傷害。主的平安運行在教會中作王！」" },
                    { title: "3. 為國度禱告", text: "利用全國嚴肅會禱告手冊〈第三週9/14-20〉的內容參與嚴肅會的禱告。為俄烏、美以伊、尼泊爾、西藏、中國受風災區求平安，為台灣選舉、國家安全向主求平安。祝福花蓮，向花蓮土地發出主同在、平安的話語。" }
                ],
                churchIntercessions: [
                    "10/2 嚴肅會前置敬拜禱告晚會",
                    "10/31 花蓮區嚴肅會代禱者訓練",
                    "11/3 花蓮區嚴肅會",
                    "12月 聖誕晚會籌備、2027年方向",
                    "母堂、志學、新秀經歷行神蹟的神，病得醫治、生命得改變更新",
                    "2027/3/27 高雄全國嚴肅會！"
                ],
                meditation: "基督的平安在我心裡作主，會有什麼生活特徵？"
            },
            {
                id: "prayer-20260906",
                date: "2026.9.6 – 9.12",
                topic: "得著不能奪去的喜樂",
                scripture: "加拉太書 5:22-23「聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。這樣的事沒有律法禁止。」",
                shareParagraphs: [
                    "聖靈所結的第二個果子是「喜樂」。聖經中的喜樂，是一種從神而來、超越環境的生命狀態，並非只是事情順利時產生的開心，或是要求自己凡事保持正面…。因為我們的喜樂根源是神自己，不是環境；換句話說，這是心性的轉向：轉向神，以神為我們的滿足，即使環境有所改變，心裡仍然可以有盼望。",
                    "耶穌說：「這些事我已經對你們說了，是要叫我的喜樂存在你們心裡，並叫你們的喜樂可以滿足。」（約15章）基督徒的喜樂不是自己製造出來的，而是從與主的連結中領受的。枝子不必努力「製造果子」，而是住在葡萄樹上，「自然結出」果子。當我們常常住在基督裡，聖靈就輸送屬天的喜樂，更多成為我們生命的一部分。",
                    "本週，我們可以操練一件事：不要讓環境決定你的喜樂，讓神的喜樂滿足你。怎麼做？當事情不如預期、禱告還沒有看見答案，甚至心情低落時：1.刻意回到神面前，數算祂的恩典、思想祂的信實，2.並宣告「來自耶和華的喜樂是我的力量！」喜樂並不否認困難，卻在困難中確信：神與我同在，祂在其中掌權。"
                ],
                prayerFocus: "喜樂根基要從環境轉向基督，在順境與逆境中都能因主而喜樂。",
                prayers: [
                    { title: "1. 為自己禱告", text: "跟主說「是祢的喜樂保護我的心，帶給我力量，我選擇從建立在環境、人的肯定或事情是否順利上『轉向祢』。奉耶穌的名，當我面對壓力、失望或等待時，按著祢的信實與良善，祢必向我顯明恩典與慈愛，使我身心靈得力、有盼望。祢的喜樂是我生命每天的力量。」" },
                    { title: "2. 為教會禱告", text: "跟主說「主啊，將從祢而來的喜樂充滿祢的教會，領受因著與基督的連結而有的喜樂。讓祢的喜樂來醫治事奉中的疲乏、失落與灰心，使軟弱的重新得力。我們選擇從追求聚會的氣氛，轉向心靈誠實的敬拜；將屬天的喜樂來充滿我們教會，喜樂的江河滔滔不絕的在教會湧流。" },
                    { title: "3. 為國度禱告", text: "宣告亞洲、美洲、中東各地，神的兒女在這個戰亂、災禍、人人自危、焦慮恐懼的時代，教會卻充滿喜樂與盼望的見證與吸引。世界越不安，神的百姓越是經歷神的信實。宣告屬主的人，要把從基督而來的喜樂盼望散佈開來。為台灣2027全國嚴肅會呼求主憐憫、保護、復興台灣。" }
                ],
                churchIntercessions: [
                    "裝備課有根基奠定",
                    "10/2 嚴肅會前置敬拜禱告晚會",
                    "10/31 花蓮區嚴肅會代禱者訓練",
                    "11/3 花蓮區嚴肅會",
                    "12月 聖誕晚會籌備、2027年方向",
                    "母堂、志學、新秀經歷行神蹟的神，病得醫治、生命得改變更新",
                    "2027/3/27 高雄全國嚴肅會！"
                ],
                meditation: "我可以怎麼在不順遂的情況下，仍然保有屬天的喜樂？"
            }
        ];

        let currentPrayerId = prayerDatabase[0].id;

        document.addEventListener('DOMContentLoaded', () => {
            fetch('bible_topics.json')
                .then(res => res.json())
                .then(data => {
                    bibleData = data;
                    flattenData(data);
                    renderSidebar(data);
                    renderAllVerses();
                })
                .catch(err => console.error(err));

            renderPrayerList();
            renderPrayerDetail(currentPrayerId);
            setupEventListeners();
        });

        function switchTab(tab) {
            const versesView = document.getElementById('view-verses');
            const prayerView = document.getElementById('view-prayer');
            const versesBtn = document.getElementById('tab-verses-btn');
            const prayerBtn = document.getElementById('tab-prayer-btn');

            if (tab === 'verses') {
                versesView.classList.remove('hidden');
                prayerView.classList.add('hidden');
                versesBtn.className = "flex-1 md:flex-initial px-4 py-1.5 rounded-lg bg-amber-400 text-indigo-950 shadow transition flex items-center justify-center space-x-1";
                prayerBtn.className = "flex-1 md:flex-initial px-4 py-1.5 rounded-lg text-indigo-200 hover:text-white hover:bg-indigo-800/50 transition flex items-center justify-center space-x-1";
            } else {
                versesView.classList.add('hidden');
                prayerView.classList.remove('hidden');
                prayerBtn.className = "flex-1 md:flex-initial px-4 py-1.5 rounded-lg bg-amber-400 text-indigo-950 shadow transition flex items-center justify-center space-x-1";
                versesBtn.className = "flex-1 md:flex-initial px-4 py-1.5 rounded-lg text-indigo-200 hover:text-white hover:bg-indigo-800/50 transition flex items-center justify-center space-x-1";
            }
        }

        function renderPrayerList() {
            const container = document.getElementById('prayer-list-container');
            container.innerHTML = prayerDatabase.map(p => `
                <button onclick="selectPrayer('${p.id}')" 
                        class="w-full text-left p-3 rounded-xl transition flex flex-col space-y-1 ${p.id === currentPrayerId ? 'bg-indigo-900 text-white shadow-md' : 'bg-slate-50 text-slate-700 hover:bg-indigo-50'}">
                    <span class="text-[11px] font-bold ${p.id === currentPrayerId ? 'text-amber-300' : 'text-indigo-600'}">
                        <i class="fa-regular fa-calendar mr-1"></i>${p.date}
                    </span>
                    <span class="text-sm font-bold truncate">${p.topic}</span>
                </button>
            `).join('');
        }

        function selectPrayer(id) {
            currentPrayerId = id;
            renderPrayerList();
            renderPrayerDetail(id);
        }

        function renderPrayerDetail(id) {
            const item = prayerDatabase.find(p => p.id === id);
            if (!item) return;

            document.getElementById('prayer-detail-container').innerHTML = `
                <article class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden">
                    <div class="bg-gradient-to-r from-indigo-900 to-indigo-800 p-6 text-white">
                        <div class="inline-block bg-amber-400 text-indigo-950 text-xs font-extrabold px-3 py-1 rounded-full mb-2">
                            <i class="fa-regular fa-calendar-check mr-1"></i>${item.date}
                        </div>
                        <h2 class="text-2xl md:text-3xl font-black text-amber-300">主題：${item.topic}</h2>
                        <p class="text-indigo-200 text-sm mt-1">小組聚會分享與同心守望禱告</p>
                    </div>

                    <div class="p-6 md:p-8 space-y-6">
                        <section class="bg-amber-50/60 rounded-xl p-4 border-l-4 border-amber-400">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-amber-800 mb-1"><i class="fa-solid fa-quote-left mr-1"></i>本週經文</h3>
                            <p class="font-serif text-slate-800 text-base md:text-lg leading-relaxed">「${item.scripture}」</p>
                        </section>

                        <section class="space-y-3 text-slate-700 leading-relaxed text-sm md:text-base">
                            <h3 class="font-bold text-indigo-950 text-lg border-b border-slate-100 pb-2"><i class="fa-solid fa-heart text-rose-500 mr-2"></i>主題分享</h3>
                            ${item.shareParagraphs.map(p => `<p>${p}</p>`).join('')}
                        </section>

                        <section class="space-y-4 pt-2">
                            <div class="bg-rose-50 rounded-xl p-3.5 border border-rose-100 text-rose-900 text-sm font-semibold flex items-center">
                                <i class="fa-solid fa-bullseye text-rose-500 text-lg mr-2.5"></i>
                                <span>禱告焦點：${item.prayerFocus}</span>
                            </div>
                            <div class="space-y-3">
                                ${item.prayers.map(pr => `
                                    <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                        <h4 class="font-bold text-indigo-900 text-sm mb-1">${pr.title}</h4>
                                        <p class="text-xs md:text-sm text-slate-600 leading-relaxed">${pr.text}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </section>

                        <section class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <h4 class="font-bold text-indigo-900 text-xs uppercase tracking-wider mb-2"><i class="fa-solid fa-shield-halved mr-1 text-indigo-600"></i>為教會事工守望</h4>
                                <ul class="text-xs text-slate-600 space-y-1.5 list-disc list-inside">
                                    ${item.churchIntercessions.map(ci => `<li>${ci}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="bg-amber-50/50 p-4 rounded-xl border border-amber-200 flex flex-col justify-between">
                                <div>
                                    <h4 class="font-bold text-amber-900 text-xs uppercase tracking-wider mb-2"><i class="fa-solid fa-brain mr-1 text-amber-600"></i>本週默想思考</h4>
                                    <p class="text-sm font-semibold text-slate-800">「${item.meditation}」</p>
                                </div>
                                <button onclick="copyCurrentPrayer('${item.id}')" class="mt-4 w-full bg-amber-400 hover:bg-amber-500 text-indigo-950 font-bold text-xs py-2 rounded-lg transition flex items-center justify-center space-x-1">
                                    <i class="fa-regular fa-copy"></i><span>複製本週禱告材料至 LINE</span>
                                </button>
                            </div>
                        </section>
                    </div>
                </article>
            `;
        }

        function copyCurrentPrayer(id) {
            const item = prayerDatabase.find(p => p.id === id);
            if (!item) return;

            const text = `【小組聚會禱告材料】${item.date}\n主題：${item.topic}\n\n經文：${item.scripture}\n\n禱告焦點：${item.prayerFocus}\n\n${item.prayers.map(p => `${p.title}：\n${p.text}`).join('\n\n')}\n\n為教會事工守望：\n${item.churchIntercessions.map(c => `• ${c}`).join('\n')}\n\n本週默想：${item.meditation}`;
            navigator.clipboard.writeText(text).then(() => showToast('已複製本週聚會禱告材料，可貼至 LINE 群組！'));
        }

        function flattenData(data) {
            allVersesFlat = [];
            data.categories.forEach(cat => {
                cat.subcategories.forEach(sub => {
                    sub.topics.forEach(topic => {
                        topic.verses.forEach(verse => {
                            allVersesFlat.push({
                                ...verse,
                                categoryName: cat.category_name,
                                topicName: topic.topic_name,
                                categoryId: cat.category_id,
                                topicId: topic.topic_id
                            });
                        });
                    });
                });
            });
        }

        function renderSidebar(data) {
            const container = document.getElementById('category-tree');
            let html = '';
            data.categories.forEach(cat => {
                html += `
                    <div class="mb-2">
                        <button onclick="toggleCategory('${cat.category_id}')" class="w-full text-left font-bold text-slate-700 hover:bg-indigo-50 p-2 rounded-lg text-sm flex justify-between items-center">
                            <span class="truncate">${cat.category_name}</span>
                            <i id="icon-${cat.category_id}" class="fa-solid fa-chevron-down text-xs text-slate-400"></i>
                        </button>
                        <div id="sub-${cat.category_id}" class="hidden pl-3 mt-1 space-y-1 border-l-2 border-indigo-100 ml-2">
                `;
                cat.subcategories.forEach(sub => {
                    html += `<div class="text-xs font-bold text-slate-400 px-2 py-1 mt-1">${sub.subcategory_name}</div>`;
                    sub.topics.forEach(topic => {
                        html += `<button onclick="filterByTopic('${topic.topic_id}', '${topic.topic_name}')" class="w-full text-left text-xs text-slate-600 hover:bg-indigo-100 px-2 py-1.5 rounded truncate">${topic.topic_name}</button>`;
                    });
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function toggleCategory(catId) {
            const sub = document.getElementById(`sub-${catId}`);
            const icon = document.getElementById(`icon-${catId}`);
            sub.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        }

        function renderCards(verses, title = '搜尋結果', subtitle = '') {
            const container = document.getElementById('cards-container');
            document.getElementById('current-title').innerText = title;
            document.getElementById('current-subtitle').innerText = subtitle;
            document.getElementById('result-count').innerText = `${verses.length} 條經文`;

            if (verses.length === 0) {
                container.innerHTML = `<div class="text-center py-16 text-slate-400"><p>找不到相關經文</p></div>`;
                return;
            }

            container.innerHTML = verses.map(v => `
                <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200/80">
                    <div class="text-xs text-indigo-600 font-medium mb-2">${v.categoryName} > ${v.topicName}</div>
                    <blockquote class="text-base font-serif text-slate-800 bg-slate-50/70 p-3.5 rounded-lg border-l-4 border-amber-400 mb-3">「${v.text}」</blockquote>
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-indigo-900 text-sm"><i class="fa-solid fa-bookmark text-amber-500 mr-1.5"></i>${v.reference}</span>
                        <button onclick="copyVerse('${v.text.replace(/'/g, "\\'")}', '${v.reference}', '${v.application_note.replace(/'/g, "\\'")}')" class="bg-indigo-50 text-indigo-700 text-xs px-3 py-1.5 rounded-lg"><i class="fa-regular fa-copy mr-1"></i>複製經文</button>
                    </div>
                    ${v.application_note ? `<div class="mt-3 pt-2 border-t border-slate-100 text-xs text-slate-500">💡 <strong>探訪提醒：</strong>${v.application_note}</div>` : ''}
                </div>
            `).join('');
        }

        function renderAllVerses() { renderCards(allVersesFlat, '全部分類經文彙編', '瀏覽庫存內所有主題與經文'); }

        function filterByTopic(topicId, topicName) {
            renderCards(allVersesFlat.filter(v => v.topicId === topicId), topicName, '主題專屬經文清單');
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebar-overlay').classList.add('hidden');
            }
        }

        function copyVerse(text, reference, note) {
            navigator.clipboard.writeText(`「${text}」\n— ${reference}\n\n💡 探訪提醒：${note}`).then(() => showToast('經文已複製！'));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 2500);
        }

        function setupEventListeners() {
            document.getElementById('search-input').addEventListener('input', (e) => {
                const keyword = e.target.value.trim().toLowerCase();
                if (!keyword) return renderAllVerses();
                const results = allVersesFlat.filter(v => v.text.toLowerCase().includes(keyword) || v.reference.toLowerCase().includes(keyword) || v.topicName.toLowerCase().includes(keyword));
                renderCards(results, `搜尋：「${keyword}」`, `找到 ${results.length} 筆相關經文`);
            });

            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            document.getElementById('mobile-menu-btn').addEventListener('click', () => {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            });
            const close = () => {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            };
            document.getElementById('close-sidebar-btn').addEventListener('click', close);
            overlay.addEventListener('click', close);
        }
    </script>
</body>
</html>
